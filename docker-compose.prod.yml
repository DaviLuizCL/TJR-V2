# Override de producao -- roda em cima do docker-compose.yml:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Mesmo projeto/volume de banco do docker-compose.yml (nao duplica dado);
# so muda o que precisa mudar pra deixar de ser um ambiente de dev:
#   - front: build de producao (nginx servindo o bundle + proxy de /api/),
#     unica porta publica exposta (80), sem VITE_API_URL/volume de codigo.
#   - api: sem --reload, sem bind mount do codigo do host (roda so o que
#     foi buildado na imagem), sem porta publicada (so alcancavel via
#     proxy do nginx, dentro da rede docker).
#   - db: sem porta publicada (so alcancavel pelo `api`, dentro da rede
#     docker).
#   - todos os tres com `restart: unless-stopped` -- se a instancia EC2 for
#     parada (Stop) a noite pra economizar e ligada de novo no dia seguinte,
#     os containers sobem sozinhos quando o Docker inicia, sem precisar
#     ninguem entrar por SSH e rodar `up -d` de novo manualmente.
services:
  db:
    restart: unless-stopped
    ports: !reset []

  api:
    restart: unless-stopped
    volumes: !reset []
    ports: !reset []
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]

  front:
    restart: unless-stopped
    image: tjr-front-prod
    build:
      target: prod
    # /etc/letsencrypt: diretorio padrao do certbot no host (fullchain.pem/
    # privkey.pem, via `certbot certonly --webroot`) -- nao e pasta do repo,
    # e onde o certbot grava por padrao.
    # certbot/www: pasta de desafio HTTP-01, compartilhada entre o nginx
    # (serve em /.well-known/acme-challenge/) e o certbot rodando no host.
    # So a segunda vai pro git (.gitignore) por ser pasta do checkout; a
    # primeira e external ao repo em qualquer instancia.
    volumes: !override
      - /etc/letsencrypt:/etc/nginx/certs:ro
      - ./certbot/www:/var/www/certbot:ro
    ports: !override
      - "80:80"
      - "443:443"
