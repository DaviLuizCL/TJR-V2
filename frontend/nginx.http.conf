# Fallback sem certificado: usado automaticamente pelo docker-entrypoint-tjr.sh
# quando /etc/nginx/certs/live/tjr.pontuai.online/fullchain.pem ainda nao
# existe (ex.: instancia nova, certbot nunca rodou nela). Serve tudo em HTTP
# puro -- e o modo real usado no dia da competicao (celular no ginasio, rede
# local, sem certificado por design; nada nesse app pode assumir HTTPS, ver
# CLAUDE.md secao 12). Mantem o path do desafio ACME liberado, entao da pra
# rodar `certbot certonly --webroot` contra este mesmo container sem mudar
# nada na mao -- assim que o certificado existir, um restart do container
# troca sozinho pro modo HTTPS (nginx.https.conf).
server {
    listen 80;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    root /usr/share/nginx/html;
    index index.html;

    # API e proxeada dentro da mesma origem (sem CORS, sem IP/porta fixo no
    # front) -- o container `api` e resolvido pelo DNS interno do docker
    # compose, sempre com esse nome de servico.
    location /api/ {
        proxy_pass http://api:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA: qualquer rota que nao seja arquivo estatico cai no index.html,
    # pro React Router decidir a tela (senao um refresh em /eventos/123/...
    # daria 404 direto no nginx).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
