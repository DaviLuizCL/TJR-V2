# Porta 80: so serve o desafio do Let's Encrypt (emissao inicial e renovacao)
# e redireciona todo o resto pra https -- ninguem deve navegar o site em
# texto puro depois que o certificado existe.
server {
    listen 80;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name _;

    # Caminho fixo (nao usa $host/server_name no nome do arquivo) porque so
    # existe um dominio de verdade (tjr.pontuai.online); certificado emitido
    # com `certbot certonly --webroot`, renovado pelo cron do host.
    ssl_certificate     /etc/nginx/certs/live/tjr.pontuai.online/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/live/tjr.pontuai.online/privkey.pem;

    root /usr/share/nginx/html;
    index index.html;

    # API e proxeada dentro da mesma origem (sem CORS, sem IP/porta fixo no
    # front) -- o container `api` e resolvido pelo DNS interno do docker
    # compose, sempre com esse nome de servico.
    location /api/ {
        proxy_pass http://api:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA: qualquer rota que nao seja arquivo estatico cai no index.html,
    # pro React Router decidir a tela (senao um refresh em /eventos/123/...
    # daria 404 direto no nginx).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
